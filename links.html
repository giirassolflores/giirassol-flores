<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7d6">
<meta name="description" content="Encontre a Giirassol Flores: monte seu buquê, peça orçamento e conheça nossas flores feitas à mão.">
<title>Giirassol Flores | Links</title>
<style>
:root{--bg:#fff7d6;--header-bg:#fffdf2;--card:#fff;--ink:#284b2b;--muted:#647b55;--primary:#687c52;--details:#687c52;--accent:#e5b900;--line:#e9dfad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px 36px;background:radial-gradient(ellipse at top,var(--header-bg) 0,var(--bg) 56%,color-mix(in srgb,var(--bg),var(--details) 12%) 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;justify-content:center}
main{width:min(100%,460px);text-align:center}
.logo{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#fff;display:grid;place-items:center;margin:10px auto 18px;font-size:48px;border:4px solid #fff;box-shadow:0 8px 24px #6a842018}
h1{font-size:27px;line-height:1.2;margin:0 0 8px;font-weight:750;letter-spacing:-.6px}
.subtitle{margin:0 0 28px;color:var(--muted);font-size:15px}
.links{display:grid;gap:13px}
a.link{min-height:62px;padding:17px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);font-weight:650;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px #6045800b;transition:transform .16s,box-shadow .16s,border-color .16s}
a.link:hover{transform:translateY(-2px);box-shadow:0 9px 22px #00000016;border-color:var(--accent)}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.icon{font-size:21px}
.social{display:flex;justify-content:center;gap:22px;margin:26px 0 20px}
.social a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--header-bg);border:1px solid var(--line);color:var(--details);text-decoration:none}.social svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{font-size:12px;color:var(--muted);margin-top:18px}
.notice{font-size:12px;color:var(--muted);min-height:16px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div id="logo" class="logo" aria-label="Logo da Giirassol Flores">🌻</div>
<h1>Giirassol Flores</h1>
<p class="subtitle">Flores eternas feitas à mão 🌻</p>
<nav class="links" aria-label="Links da Giirassol Flores">
<a class="link" href="./index.html"><span class="icon" aria-hidden="true">💐</span> Monte seu buquê / Catálogo</a>
<a class="link" href="./prices.html"><span class="icon" aria-hidden="true">💛</span> Tabela de preços</a>
<a class="link" id="whatsapp" href="https://wa.me/5586981748569" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">💬</span> WhatsApp / Peça um orçamento</a>
<a class="link" id="instagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">📸</span> Instagram</a>
</nav>
<div class="social" aria-label="Redes sociais">
<a id="socialInstagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle></svg></a>
<a id="socialWhatsapp" href="https://wa.me/5586981748569" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 11.7a8.1 8.1 0 0 1-12 7.1L3 20l1.3-5a8.1 8.1 0 1 1 15.9-3.3Z"></path><path d="M8.3 7.8c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.8 1.9c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4-.1.6.5.9 1.3 1.7 2.3 2.2.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.8.9c.2.1.4.3.4.5 0 .4-.2 1.1-.7 1.5-.5.4-1.1.7-1.8.6-1-.1-2.3-.6-3.7-1.8-1.5-1.3-2.5-2.9-2.8-3.9-.3-.9 0-1.9.7-2.6Z"></path></svg></a>
</div>
<p class="notice" id="status" aria-live="polite"></p>
<footer>Feito com carinho · Giirassol Flores</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const client=window.supabase.createClient('https://plwtpqjdloziqgshyisn.supabase.co','sb_publishable_7fL4YZHParuDFtxctX1bcA_aOkEljcf');
    const {data,error}=await client.from('store_settings').select('whatsapp,instagram,logo_image,theme_bg,theme_header,theme_surface,theme_primary,theme_details,theme_text,theme_secondary,theme_accent,seasonal_campaigns').eq('id',1).maybeSingle();
    if(error) throw error;
    if(!data) return;
    const palettes={
      christmas:{theme_bg:"#FFF9F0",theme_header:"#FFF3E0",theme_surface:"#FFF7EA",theme_primary:"#C62828",theme_details:"#0F5132",theme_text:"#2E3B2D",theme_secondary:"#6B6B6B",theme_accent:"#D4AF37"},
      easter:{theme_bg:"#FBF7FF",theme_header:"#F1E6FA",theme_surface:"#FFFFFF",theme_primary:"#9165A8",theme_details:"#B66F91",theme_text:"#45394B",theme_secondary:"#827589",theme_accent:"#E8C7A5"},
      valentines:{theme_bg:"#FFF5F7",theme_header:"#FCE4EC",theme_surface:"#FFFFFF",theme_primary:"#B8325A",theme_details:"#7D2446",theme_text:"#482C37",theme_secondary:"#8B737C",theme_accent:"#E9A6B7"},
      anniversary:{theme_bg:"#FFF9E8",theme_header:"#FFF0BD",theme_surface:"#FFFFFF",theme_primary:"#D89A19",theme_details:"#6C8A45",theme_text:"#493B25",theme_secondary:"#85765B",theme_accent:"#F2C94C"},
      original:{theme_bg:"#fff9ef",theme_header:"#fff8e9",theme_surface:"#ffffff",theme_primary:"#687c52",theme_details:"#687c52",theme_text:"#4d473b",theme_secondary:"#877d6b",theme_accent:"#f5e6b8"}
    };
    const today=new Date(),todayKey=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
    const activeCampaign=(Array.isArray(data.seasonal_campaigns)?data.seasonal_campaigns:[]).filter(c=>c&&c.start_date&&c.end_date&&c.start_date<=todayKey&&c.end_date>=todayKey).sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date)))[0]||null;
    const palette=activeCampaign?(palettes[activeCampaign.palette]||palettes.original):null;
    const theme={...data,...(palette||{})};
    const root=document.documentElement;
    [["--bg","theme_bg","#fff7d6"],["--header-bg","theme_header","#fffdf2"],["--card","theme_surface","#ffffff"],["--primary","theme_primary","#687c52"],["--details","theme_details","#687c52"],["--ink","theme_text","#284b2b"],["--muted","theme_secondary","#647b55"],["--accent","theme_accent","#e5b900"]].forEach(([variable,key,fallback])=>root.style.setProperty(variable,theme[key]||fallback));
    root.style.setProperty("--line","color-mix(in srgb,"+(theme.theme_accent||"#e5b900")+" 48%, transparent)");
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content",theme.theme_bg||"#fff7d6");
    const digits=String(data.whatsapp||'5586981748569').replace(/\D/g,'');
    const wa='https://wa.me/'+digits;
    document.getElementById('whatsapp').href=wa;
    document.getElementById('socialWhatsapp').href=wa;
    const ig=String(data.instagram||'').trim();
    if(ig){
      const normalized=/^https?:\/\//i.test(ig)?ig:'https://www.instagram.com/'+ig.replace(/^@/,'').replace(/\/$/,'')+'/';
      document.getElementById('instagram').href=normalized;
      document.getElementById('socialInstagram').href=normalized;
    }else{
      document.getElementById('instagram').hidden=true;
      document.getElementById('socialInstagram').hidden=true;
    }
    if(data.logo_image){
      const img=document.createElement('img');img.src=data.logo_image;img.alt='Logo Giirassol Flores';img.className='logo';
      const old=document.getElementById('logo');old.replaceWith(img);
    }
  }catch(e){status.textContent='Os links principais continuam disponíveis.';console.warn('Não foi possível carregar os links da loja:',e);}
})();
</script>
</body>
</html>
